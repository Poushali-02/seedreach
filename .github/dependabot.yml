# Weekly update PRs for Python packages and GitHub Actions. Minor and patch bumps are grouped into one
# PR per ecosystem so a solo maintainer isn't flooded; tests must pass before anything merges.
version: 2
updates:
  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    # requirements.txt uses `>=` ranges, so installs already pick up new releases. Only touch a
    # requirement when its range would block a new version; never just raise minimums.
    versioning-strategy: increase-if-necessary
    groups:
      python-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
