name: Bug report
description: Something doesn't work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please remove any personal data (emails, tokens, profile details) from logs before posting.
        Security problems go to SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you ran, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and output
      description: The command you ran and the relevant output (redact founder emails).
      render: text
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: "OS, Python version, LLM provider (gemini/anthropic), local or GitHub Actions"
