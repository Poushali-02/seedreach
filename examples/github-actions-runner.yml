# Scheduled seedreach runs on GitHub Actions.
#
# Put this file in a PRIVATE repo (not your public fork) at .github/workflows/seedreach.yml.
# Private matters: Actions logs and the saved database contain founder email addresses.
# Setup steps are in the README section "Run it on a schedule".

name: seedreach

on:
  schedule:
    - cron: "30 3 * * *"          # 03:30 UTC daily (09:00 IST). Edit to taste.
  workflow_dispatch:               # "Run workflow" button, also in the GitHub mobile app
    inputs:
      limit:
        description: "Stop after this many drafts"
        default: "5"
      source:
        description: "Where to find startups"
        type: choice
        options: [hn, producthunt, all]
        default: hn
      dry_run:
        description: "Print drafts only; save nothing"
        type: boolean
        default: false

concurrency:
  group: seedreach                 # never two runs at once: they share one database
  cancel-in-progress: false

permissions:
  contents: write                  # to commit the updated database to the state branch

env:
  SEEDREACH_REPO: Poushali-02/seedreach   # the code to run; change if you use a fork

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out saved state (outreach.db)
        uses: actions/checkout@v4
        with:
          ref: state
          path: state

      - name: Check out seedreach
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SEEDREACH_REPO }}
          path: app

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - run: pip install -r app/requirements.txt

      - name: Write credential files from secrets
        working-directory: app
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          umask 077
          printf '%s' "$GMAIL_TOKEN" > token.json
          printf '%s' "$GMAIL_CREDENTIALS" > credentials.json
          printf '%s' "$PROFILE_JSON" > profile.json

      - name: Run seedreach
        working-directory: app
        env:
          HEADLESS: "1"
          DB_PATH: ${{ github.workspace }}/state/outreach.db
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          LIMIT: ${{ inputs.limit || '5' }}
          SOURCE: ${{ inputs.source || 'hn' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python main.py run --limit "$LIMIT" --source "$SOURCE" $DRY_RUN

      - name: Save state
        if: ${{ always() && !inputs.dry_run }}
        working-directory: state
        run: |
          git config user.name "seedreach-bot"
          git config user.email "seedreach-bot@users.noreply.github.com"
          git add outreach.db
          git diff --cached --quiet && echo "No changes to save." && exit 0
          git commit -m "state: run ${{ github.run_number }}"
          git push
