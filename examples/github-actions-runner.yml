# Scheduled seedreach runs on GitHub Actions.
#
# Put this file in a PRIVATE repo (not your public fork) at .github/workflows/seedreach.yml.
# Private matters: Actions logs and the saved database contain founder email addresses.
# Setup steps are in the README section "Run it on a schedule".

name: seedreach

on:
  schedule:
    - cron: "30 3 * * *"          # 03:30 UTC daily (09:00 IST). Edit to taste.
  workflow_dispatch:               # "Run workflow" button, also in the GitHub mobile app
    inputs:
      limit:
        description: "Stop after this many drafts"
        default: "5"
      source:
        description: "Where to find startups"
        type: choice
        options: [all, yc, launchhn, hn, producthunt]
        default: all
      dry_run:
        description: "Print drafts only; save nothing"
        type: boolean
        default: false

concurrency:
  group: seedreach                 # never two runs at once: they share one database
  cancel-in-progress: false

permissions:
  contents: write                  # to commit the updated database to the state branch
  issues: write                    # to post each run's digest on an issue (see "Post the digest")

env:
  SEEDREACH_REPO: Poushali-02/seedreach   # the code to run; change if you use a fork
  # Pin to a release you have reviewed, never main: this job holds your Gmail token, so it should only
  # run code you trust. Use the release's commit ID, not its tag: a tag can be moved, a commit can't.
  # To upgrade, read the new release, run `git rev-parse vX.Y.Z^{commit}` in seedreach, put the result
  # here and update the version comment.
  SEEDREACH_REF: a2e30dcce0eb7e369ee3b9be51ee54c1b232b28b # v0.5.0

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out saved state (outreach.db)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: state
          path: state

      - name: Check out seedreach
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ env.SEEDREACH_REPO }}
          ref: ${{ env.SEEDREACH_REF }}
          path: app

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/requirements.txt

      - run: pip install -r app/requirements.txt

      - name: Write credential files from secrets
        working-directory: app
        env:
          GMAIL_TOKEN: ${{ secrets.GMAIL_TOKEN }}
          GMAIL_CREDENTIALS: ${{ secrets.GMAIL_CREDENTIALS }}
          PROFILE_JSON: ${{ secrets.PROFILE_JSON }}
        run: |
          umask 077
          printf '%s' "$GMAIL_TOKEN" > token.json
          printf '%s' "$GMAIL_CREDENTIALS" > credentials.json
          printf '%s' "$PROFILE_JSON" > profile.json

      - name: Run seedreach
        working-directory: app
        env:
          HEADLESS: "1"
          DB_PATH: ${{ github.workspace }}/state/outreach.db
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'gemini' }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-flash-lite-latest' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          APOLLO_API_KEY: ${{ secrets.APOLLO_API_KEY }}
          YC_REGIONS: ${{ vars.YC_REGIONS }}            # optional repo variables, e.g. India,Remote
          PREFER_REGIONS: ${{ vars.PREFER_REGIONS }}
          # Optional run summary (company names and counts only); unset secrets mean no message
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          LIMIT: ${{ inputs.limit || '5' }}
          SOURCE: ${{ inputs.source || 'all' }}
          DRY_RUN: ${{ inputs.dry_run && '--dry-run' || '' }}
        run: python main.py run --limit "$LIMIT" --source "$SOURCE" $DRY_RUN --digest "$GITHUB_WORKSPACE/digest.md"

      # Comments on one issue, "seedreach: apply and reach out", and @-mentions you, so the GitHub mobile app
      # notifies you: roles to apply for, founders to reach on LinkedIn, drafts to review. No email addresses.
      - name: Post the digest
        if: ${{ always() }}
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
          RUN: ${{ github.run_number }}
        run: |
          f="$GITHUB_WORKSPACE/digest.md"
          if [ ! -s "$f" ]; then echo "Nothing new for you in this run."; exit 0; fi
          title="seedreach: apply and reach out"
          n=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" \
                --json number --jq '.[0].number // empty')
          if [ -z "$n" ]; then
            url=$(gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" \
                    --body "Each scheduled run comments here with roles to apply for, founders to reach and drafts to review.")
            n="${url##*/}"
          fi
          { echo "@$OWNER, run $RUN:"; echo; cat "$f"; } > "$RUNNER_TEMP/comment.md"
          gh issue comment "$n" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/comment.md"

      - name: Save state
        if: ${{ always() && !inputs.dry_run }}
        working-directory: state
        run: |
          git config user.name "seedreach-bot"
          git config user.email "seedreach-bot@users.noreply.github.com"
          git add outreach.db
          git diff --cached --quiet && echo "No changes to save." && exit 0
          git commit -m "state: run ${{ github.run_number }}"
          git push
